name: Jest Tests

on:
  push:
    paths:
      - "packages/jest/**"
      - ".github/workflows/jest.yml"
  pull_request:
    paths:
      - "packages/jest/**"
      - ".github/workflows/jest.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/jest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run Jest tests
        run: npm test
